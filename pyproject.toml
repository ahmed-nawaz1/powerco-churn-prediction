[project]
name = "powerco-churn"
version = "2.0.0"
description = "CPS7008 reproducible customer churn research project"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["legacy", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
